<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Prototipo · clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css?v=20261118i">
<link rel="stylesheet" href="/celular.css?v=20261118i" media="(max-width: 720px)">
<script>
  (function () {
    var t = null; try { t = localStorage.getItem("dt-theme"); } catch (e) {}
    var q = new URLSearchParams(location.search).get("tema");
    document.documentElement.dataset.theme = q || t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  })();
</script>
<style>
/* ---------- rotulo: mono porque lleva datos (cuantos y en que estado) ---------- */
.pv-rotulo {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 14px;
  margin: 0 0 clamp(22px, 3vw, 34px); font-family: var(--font-mono); font-size: var(--t-2); color: var(--text);
}
.pv-rotulo .pv-t { letter-spacing: 0.02em; }
.pv-rotulo .pv-cursor { display: inline-block; width: 0.6em; height: 1.1em; margin-left: 2px; translate: 0 0.15em; background: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .pv-rotulo .pv-cursor { animation: pvParpadeo 1.1s steps(1) infinite; } }
@keyframes pvParpadeo { 50% { opacity: 0; } }
.pv-rotulo .pv-datos { color: var(--muted); font-size: var(--t-1); font-variant-numeric: tabular-nums; }
.pv-rotulo .pv-datos b { color: var(--ok-ink); font-weight: 500; }
.pv-punto { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; translate: 0 -1px; }
.pv-punto.wip { background: var(--amber); }
.pv-punto.uso { background: var(--accent); }
.pv-ancho { width: min(var(--pill), 1320px); margin-inline: auto; }
.clientes-banda .marca { color: var(--text); }

/* ---------- 1. Ficha: todos a la vista, cada casilla con su dato ---------- */
.v-ficha { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.v-ficha .cas {
  position: relative; display: grid; grid-template-rows: 1fr auto; place-items: center; min-height: 128px; padding: 18px 10px 12px;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); color: inherit; text-decoration: none;
  transition: background-color 200ms var(--fx-ease);
}
.v-ficha .cas .logo { zoom: 1; opacity: 0.82; transition: opacity 200ms var(--fx-ease), transform 260ms var(--fx-ease); }
.v-ficha .cas .dato { font-family: var(--font-mono); font-size: var(--t-1); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
@media (hover: hover) {
  .v-ficha a.cas:hover { background: var(--card); }
  .v-ficha a.cas:hover .logo { opacity: 1; transform: translateY(-3px); }
  .v-ficha a.cas:hover .dato { color: var(--accent-ink); }
}
.v-ficha a.cas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.v-ficha .d-corto { display: none; }
@media (max-width: 720px) { .v-ficha .d-largo { display: none; } .v-ficha .d-corto { display: inline; } }
.v-ficha .cas.tuya { background: color-mix(in oklch, var(--accent) 10%, transparent); }
.v-ficha .cas.tuya .tuya-t { font-size: var(--t-3); font-weight: 500; text-align: center; color: var(--text); }
.v-ficha .cas.tuya .dato { color: var(--accent-ink); }
@media (prefers-reduced-motion: no-preference) {
  .v-ficha .cas { animation: pvEntra 520ms var(--fx-ease) both; animation-delay: calc(var(--i) * 40ms); }
}
@keyframes pvEntra { from { opacity: 0; transform: translateY(10px); } }
@media (max-width: 980px) { .v-ficha { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 720px) {
  .v-ficha { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .v-ficha .cas { min-height: 96px; padding: 14px 6px 10px; }
  .v-ficha .cas .logo { zoom: 0.7; }
  .v-ficha .cas .dato { font-size: 10px; }
}

/* ---------- 2. Foco: uno por vez, grande, con su ficha; abajo el indice ---------- */
.v-foco { display: grid; gap: clamp(20px, 3vw, 36px); }
.v-foco .esc {
  display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: center; gap: clamp(20px, 4vw, 64px);
  min-height: 220px; padding: clamp(22px, 4vw, 48px); border: 1px solid var(--line); border-radius: 24px; background: var(--card);
}
.v-foco .esc-logo { display: grid; place-items: center; min-height: 140px; }
.v-foco .esc-logo .logo { zoom: 2; justify-self: center; margin-inline: auto; }
.v-foco .esc-dat h3 { font-size: var(--t-6); font-weight: 500; letter-spacing: -0.02em; }
.v-foco .esc-dat p { margin-top: 8px; color: var(--muted); }
.v-foco .esc-dat dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin-top: 18px; font-family: var(--font-mono); font-size: var(--t-1); }
.v-foco .esc-dat dt { color: var(--muted); }
.v-foco .esc-dat a { color: var(--accent-ink); }
.v-foco .esc-in { animation: pvFoco 320ms var(--fx-ease) both; }
@keyframes pvFoco { from { opacity: 0; transform: translateY(8px); filter: blur(4px); } }
@media (prefers-reduced-motion: reduce) { .v-foco .esc-in { animation: none; } }
.v-foco .ind { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.v-foco .ind button {
  position: relative; display: grid; place-items: center; min-width: 96px; height: 52px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 12px; background: none; color: inherit; cursor: pointer; overflow: hidden;
  transition: border-color 200ms var(--fx-ease), background-color 200ms var(--fx-ease);
}
.v-foco .ind button .logo { zoom: 0.6; opacity: 0.6; transition: opacity 200ms var(--fx-ease); }
.v-foco .ind button[aria-pressed="true"] { border-color: var(--text); }
.v-foco .ind button[aria-pressed="true"] .logo, .v-foco .ind button:hover .logo { opacity: 1; }
.v-foco .ind button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.v-foco .ind .barra { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); }
.v-foco .ind button[aria-pressed="true"] .barra.corre { animation: pvBarra var(--dur, 3200ms) linear both; }
.v-foco.quieto .ind .barra { animation-play-state: paused !important; }
@keyframes pvBarra { to { transform: scaleX(1); } }
@media (max-width: 720px) {
  .v-foco .esc { grid-template-columns: minmax(0, 1fr); text-align: center; min-height: 0; }
  .v-foco .esc-logo { min-height: 96px; }
  .v-foco .esc-logo .logo { zoom: 1.3; }
  .v-foco .esc-dat dl { justify-content: center; text-align: left; }
  .v-foco .ind { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .v-foco .ind::-webkit-scrollbar { display: none; }
  .v-foco .ind button { flex: none; min-width: 84px; height: 48px; }
}

/* ---------- 3. Indice: una lista que se lee como un registro ---------- */
.v-ind { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: clamp(24px, 5vw, 72px); }
.v-ind li { break-inside: avoid; border-top: 1px solid var(--line); }
.v-ind .fila {
  display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; align-items: center; gap: 16px;
  min-height: 64px; padding: 8px 4px; color: inherit; text-decoration: none; transition: background-color 200ms var(--fx-ease);
}
.v-ind .fila .lg { display: flex; align-items: center; height: 46px; }
.v-ind .fila .logo { zoom: 0.8; opacity: 0.85; }
.v-ind .fila .tx b { display: block; font-weight: 500; }
.v-ind .fila .tx small { display: block; color: var(--muted); font-size: var(--t-2); }
.v-ind .fila .est { font-family: var(--font-mono); font-size: var(--t-1); color: var(--muted); white-space: nowrap; }
.v-ind .fila .fl { display: inline-block; margin-left: 8px; transition: transform 200ms var(--fx-ease); }
@media (hover: hover) {
  .v-ind a.fila:hover { background: var(--card); }
  .v-ind a.fila:hover .fl { transform: translate(3px, -3px); }
}
.v-ind a.fila:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
@media (prefers-reduced-motion: no-preference) {
  .v-ind li { animation: pvEntra 480ms var(--fx-ease) both; animation-delay: calc(var(--i) * 35ms); }
}
@media (max-width: 980px) { .v-ind { columns: 1; } }
@media (max-width: 720px) {
  .v-ind .fila { grid-template-columns: 96px minmax(0, 1fr); gap: 12px; }
  .v-ind .fila .logo { zoom: 0.6; }
  .v-ind .fila .est { grid-column: 2; margin-top: -4px; }
}

/* ---------- contexto ---------- */
.pv-ctx { padding-top: 40px; text-align: center; }

/* ---------- picker (verbatim de la skill prototype) ---------- */
.proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
.proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
.proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
@media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
  <main>
    <section class="clientes-banda" aria-label="Clientes">
      <div class="wrap">
        <p class="pv-rotulo" aria-label="Algunos de mis clientes: 11, 8 en línea">
          <span class="pv-t" aria-hidden="true">Algunos de mis clientes</span><span class="pv-cursor" aria-hidden="true"></span>
          <span class="pv-datos" aria-hidden="true">[11] · <span class="pv-punto"></span><b>8</b> en línea</span>
        </p>
        <div id="stage" class="pv-ancho"></div>
      </div>
    </section>
    <section class="todos-sec pv-ctx">
      <div class="wrap">
        <div class="sec-head"><h2 class="h2">Todos los proyectos.</h2><p class="sub">Webs, sistemas, juegos y apps.</p></div>
        <div class="tabs" style="display:flex"><button class="tab" aria-selected="true">En línea <span class="tab-n">10</span></button><button class="tab">Sistemas <span class="tab-n">3</span></button><button class="tab">Juegos y apps <span class="tab-n">4</span></button><button class="tab">Por salir <span class="tab-n">4</span></button></div>
      </div>
    </section>
  </main>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Ficha</button>
    <button class="proto-picker-item">Foco</button>
    <button class="proto-picker-item">Índice</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

<script>
const C = [{"clase": "melou", "nombre": "melou", "sub": "Web + reservas · retiros en Salta", "url": "https://melou.com.ar", "estado": "live"}, {"clase": "baza", "nombre": "BAZA", "sub": "Tienda a medida · atelier de cuero", "url": "https://baza.com.ar", "estado": "live"}, {"clase": "canada", "nombre": "Cañada Húmeda", "sub": "Institucional trilingüe · agro", "url": "https://canadahumeda.com.ar", "estado": "live"}, {"clase": "aires", "nombre": "Aires de San Lorenzo", "sub": "Barrio privado · inmobiliario", "url": "https://airesdesanlorenzo.com", "estado": "live"}, {"clase": "saurium", "nombre": "Saurium", "sub": "Chukum de Yucatán · bilingüe", "url": "https://sauriumchukum.com", "estado": "live"}, {"clase": "latorre", "nombre": "Edificio La Torre", "sub": "Emprendimiento inmobiliario · Salta", "url": "https://edificiolatorre.com", "estado": "live"}, {"clase": "molins", "nombre": "Francisco Molins", "sub": "Portal inmobiliario · Salta", "url": "https://franciscomolins.com", "estado": "live"}, {"clase": "bf", "nombre": "BF Studio", "sub": "CRM a medida · Salta", "url": "", "estado": "uso"}, {"clase": "mavenz", "nombre": "MAVENZ", "sub": "Comercializadora inmobiliaria · Salta", "url": "https://mavenz.com.ar", "estado": "live"}, {"clase": "josi", "nombre": "Josi Compagnucci", "sub": "Tienda de obra original · Barcelona", "url": "", "estado": "wip"}, {"clase": "retazos", "nombre": "RETAZOS", "sub": "Bolsos de media sombra recuperada · Salta", "url": "", "estado": "wip"}];
const ESTADO = {"live": "en línea", "uso": "en uso", "wip": "en desarrollo"};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const host = (u) => u.replace(/^https?:\/\//, "").replace(/\/$/, "");
const logo = (c) => `<span class="logo marca m-${c.clase}" role="img" aria-label="${c.nombre}"></span>`;
const logoBf = (c) => c.clase === "bf" ? `<span class="logo marca-txt marca-par" style="display:flex;align-items:center;gap:9px;font-size:13px;letter-spacing:.12em"><span class="marca m-bf"></span>BF Studio</span>` : logo(c);
const punto = (e) => `<span class="pv-punto ${e === "live" ? "" : e}"></span>`;

// rotulo: se arma letra por letra desde caracteres de maquina, una vez
function descifrar() {
  const el = document.querySelector(".pv-t"); const final = el.textContent; if (reduced) return;
  const pool = "01<>/_#{}[]=";
  let t = 0; const total = 22;
  const paso = () => {
    t++; const listo = Math.floor(final.length * t / total);
    el.textContent = final.split("").map((ch, i) => i < listo || ch === " " ? ch : pool[(i * 7 + t) % pool.length]).join("");
    if (t < total) setTimeout(paso, 32); else el.textContent = final;
  };
  paso();
}

function ficha() {
  const cas = C.map((c, i) => {
    const dato = c.url ? host(c.url) : ESTADO[c.estado];
    const inner = `<span class="logo-c">${logoBf(c)}</span><span class="dato">${punto(c.estado)}<span class="d-largo">${dato}</span><span class="d-corto">${ESTADO[c.estado]}</span></span>`;
    return c.url ? `<a class="cas" style="--i:${i}" href="${c.url}" target="_blank" rel="noopener" aria-label="${c.nombre}, ${c.sub}">${inner}</a>`
                 : `<div class="cas" style="--i:${i}">${inner}</div>`;
  }).join("");
  return `<div class="v-ficha">${cas}<a class="cas tuya" style="--i:${C.length}" href="/#contacto"><span class="tuya-t">¿La tuya?</span><span class="dato">Escribime →</span></a></div>`;
}

let focoTimer = 0;
function foco() {
  const ind = C.map((c, i) => `<button type="button" aria-pressed="${i === 0}" aria-label="${c.nombre}" data-i="${i}">${logoBf(c)}<span class="barra"></span></button>`).join("");
  setTimeout(montarFoco, 0);
  return `<div class="v-foco"><div class="esc" aria-live="polite"></div><div class="ind" role="group" aria-label="Elegir cliente">${ind}</div></div>`;
}
function montarFoco() {
  const raiz = document.querySelector(".v-foco"); if (!raiz) return;
  const esc = raiz.querySelector(".esc"); const bots = [...raiz.querySelectorAll(".ind button")];
  let k = 0; const DUR = 3200;
  const pintar = () => {
    const c = C[k];
    esc.innerHTML = `<div class="esc-logo esc-in">${logoBf(c)}</div><div class="esc-dat esc-in"><h3>${c.nombre}</h3><p>${c.sub}</p>
      <dl><dt>estado</dt><dd>${punto(c.estado)}${ESTADO[c.estado]}</dd>${c.url ? `<dt>sitio</dt><dd><a href="${c.url}" target="_blank" rel="noopener">${host(c.url)} ↗</a></dd>` : ""}</dl></div>`;
    bots.forEach((b, j) => { b.setAttribute("aria-pressed", j === k); const bar = b.querySelector(".barra"); bar.classList.remove("corre"); if (j === k && !reduced) { void bar.offsetWidth; bar.classList.add("corre"); } });
  };
  const sig = () => { k = (k + 1) % C.length; pintar(); bots[k].scrollIntoView({ block: "nearest", inline: "nearest" }); };
  const andar = () => { clearInterval(focoTimer); if (!reduced && !raiz.classList.contains("quieto")) focoTimer = setInterval(sig, DUR); };
  bots.forEach((b) => b.addEventListener("click", () => { k = +b.dataset.i; pintar(); andar(); }));
  raiz.addEventListener("pointerenter", () => { raiz.classList.add("quieto"); clearInterval(focoTimer); });
  raiz.addEventListener("pointerleave", () => { raiz.classList.remove("quieto"); andar(); });
  raiz.addEventListener("focusin", () => { raiz.classList.add("quieto"); clearInterval(focoTimer); });
  raiz.addEventListener("focusout", () => { raiz.classList.remove("quieto"); andar(); });
  pintar(); andar();
}

function indice() {
  const filas = C.map((c, i) => {
    const inner = `<span class="lg">${logoBf(c)}</span><span class="tx"><b>${c.nombre}</b><small>${c.sub}</small></span><span class="est">${punto(c.estado)}${c.url ? host(c.url) : ESTADO[c.estado]}${c.url ? '<span class="fl" aria-hidden="true">↗</span>' : ""}</span>`;
    return `<li style="--i:${i}">${c.url ? `<a class="fila" href="${c.url}" target="_blank" rel="noopener">${inner}</a>` : `<div class="fila">${inner}</div>`}</li>`;
  }).join("");
  return `<ul class="v-ind">${filas}</ul>`;
}

const variants = [ficha, foco, indice];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
function mount(i) { clearInterval(focoTimer); stage.innerHTML = ''; requestAnimationFrame(() => { stage.innerHTML = variants[i](); descifrar(); }); }
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
